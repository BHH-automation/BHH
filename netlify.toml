# Netlify configuration for BHH Website
# This enables auto-deploy when you push to any connected git repository
# Test deploy 8 May 2026

[build]
  # The directory to deploy - in this case, the root directory
  publish = "."
  # No build command needed - we're serving static files directly
  command = ""

[context.production]
  environment = { CONTEXT = "production" }

# 16 September 2026: the six spare addresses below send every visitor to the main
# address instead of serving a second copy of the site. This keeps one website in
# search results rather than seven competing copies of the same pages.

[[redirects]]
  from = "https://britishheritagehosts.co.uk/*"
  to = "https://britishheritagehosts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.britishheritagehosts.co.uk/*"
  to = "https://britishheritagehosts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://britainheritagehosts.com/*"
  to = "https://britishheritagehosts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.britainheritagehosts.com/*"
  to = "https://britishheritagehosts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://britainheritagehosts.co.uk/*"
  to = "https://britishheritagehosts.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.britainheritagehosts.co.uk/*"
  to = "https://britishheritagehosts.com/:splat"
  status = 301
  force = true

# 18 September 2026: working files that live in this folder for convenience but
# must never be downloadable from the website. They are answered as not found.
# The server functions themselves run on Supabase, so hiding the source here
# changes nothing about how they work.

[[redirects]]
  from = "/supabase/*"
  to = "/offline.html"
  status = 404
  force = true

[[redirects]]
  from = "/deploy%20site.bat"
  to = "/offline.html"
  status = 404
  force = true

[[redirects]]
  from = "/trail%20photo%20sources.txt"
  to = "/offline.html"
  status = 404
  force = true

[[redirects]]
  from = "/trail%20places%20data.txt"
  to = "/offline.html"
  status = 404
  force = true

# Redirect thank-you page back to home to prevent 404
[[redirects]]
  from = "/thank-you"
  to = "/"
  status = 200

# Ensure form submissions work
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # 16 September 2026: when a visitor clicks away from the site, this controls how much
    # of the address they came from is handed to the next site. Without it browsers pass
    # the full address. With this they pass only "britishheritagehosts.com" to other sites,
    # and nothing at all to an insecure one.
    Referrer-Policy = "strict-origin-when-cross-origin"
