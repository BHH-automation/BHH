<!DOCTYPE html>
<!--
  British Heritage Hosts Ltd, partner page for fast requests
  Owner: Faleh al Bishi, Director, British Heritage Hosts Ltd
  Written 5 October 2026

  A transport or boat partner arrives here from the email or WhatsApp message
  sent when a guest asks for an Airport Transfer or a Canal Day Cruise. The
  link carries a private key for that partner and that request only. The
  partner sees the details, may give a price, and accepts or declines. The
  first partner to accept takes the job.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Faleh al Bishi">
<title>British Heritage Hosts, booking request</title>
<meta name="theme-color" content="#0D1B2A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/appletouchicon.png">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>

<header>
  <img src="/appletouchicon.png" alt="British Heritage Hosts">
  <h1>Booking request</h1>
</header>

<main>
  <section id="loading" class="card"><p class="lead">Opening the request.</p></section>
  <section id="problem" class="card hidden"><h2>We could not open this request</h2><p class="lead" id="problemText"></p>
    <p class="note">Please write to <a href="mailto:info@britishheritagehosts.com">info@britishheritagehosts.com</a>.</p></section>

  <section id="content" class="card booking hidden">
    <div class="ref" id="who"></div>
    <h2 id="service"></h2>
    <table class="rules">
      <tr><td>Date</td><td id="date"></td></tr>
      <tr><td>Party</td><td id="party"></td></tr>
      <tr><td>Details</td><td id="details"></td></tr>
    </table>

    <div id="answerBox">
      <label for="price">Your price in pounds (optional)</label>
      <input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="for example 95">
      <label for="note">A note for us (optional)</label>
      <textarea id="note" rows="3" placeholder="for example vehicle type or meeting point"></textarea>
      <button id="accept" type="button">Accept this booking</button>
      <button id="decline" class="quiet" type="button">Decline</button>
      <p class="note">The first partner to accept takes the booking.</p>
    </div>
    <div id="result"></div>
  </section>
</main>

<footer>British Heritage Hosts Ltd</footer>

<script>
(function () {
  "use strict";
  var FN = "https://pwqdzitsezblncmewxsf.supabase.co/functions/v1/Payments";
  var q = new URLSearchParams(location.search);
  var O = q.get("o") || "", K = q.get("k") || "";
  var el = function (id) { return document.getElementById(id); };
  function show(id) { el(id).classList.remove("hidden"); }
  function hide(id) { el(id).classList.add("hidden"); }
  function call(body) {
    body.o = O; body.k = K;
    return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, message: "No reply from the server." }; }); });
  }
  function done(text, good) {
    hide("answerBox");
    el("result").innerHTML = '<div class="message ' + (good ? "good" : "bad") + '"></div>';
    el("result").firstChild.textContent = text;
  }
  var WORDS = {
    accepted: "Thank you. The booking is yours. We will send you the full details shortly.",
    taken: "Thank you. Another partner accepted this request first, so nothing more is needed from you.",
    declined: "Thank you for letting us know. Nothing more is needed from you."
  };

  call({ action: "offer_view" }).then(function (r) {
    hide("loading");
    if (!r.ok) { show("problem"); el("problemText").textContent = r.message || "This link is not valid."; return; }
    show("content");
    el("who").textContent = "For " + r.partner;
    el("service").textContent = r.request.service;
    el("date").textContent = r.request.nice_date;
    el("party").textContent = r.request.party_size ? r.request.party_size + " people" : "Not given";
    el("details").textContent = r.request.details || "None";
    if (r.mine) done(WORDS.accepted, true);
    else if (r.taken) done(WORDS.taken, false);
    else if (r.answer === "declined") done(WORDS.declined, true);
  });

  function answer(kind) {
    el("accept").disabled = true; el("decline").disabled = true;
    call({ action: "offer_answer", answer: kind, price: el("price").value, note: el("note").value }).then(function (r) {
      if (!r.ok) { el("accept").disabled = false; el("decline").disabled = false; done(r.message || "That did not work. Please try again.", false); show("answerBox"); return; }
      done(WORDS[r.result] || WORDS.declined, r.result !== "taken");
    });
  }
  el("accept").addEventListener("click", function () { answer("accept"); });
  el("decline").addEventListener("click", function () { if (confirm("Decline this request?")) answer("decline"); });
})();
</script>
</body>
</html>
